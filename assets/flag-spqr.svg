assets/flag-spqr.svg
@fraxgut
CC-BY-SA-4.0
Language marker for the Latin translation: SPQR inside a laurel wreath

The waved outline follows the shared flag silhouette of Noto Emoji
(Apache-2.0, googlefonts/noto-emoji). The wreath and lettering are original
work. The charge follows the wave only in part: at full strength it inherits
the 1.6 degree tilt of the cloth across the width, which reads as a crooked
drawing rather than as a flag.
-->
